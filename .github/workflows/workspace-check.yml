name: workspace-check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out platform and components
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Validate script modes
        run: test -x scripts/bootstrap.sh -a -x scripts/doctor.sh -a -x scripts/run-digital-mcp.sh

      - name: Configure component remotes
        run: ./scripts/bootstrap.sh

      - name: Validate workspace, Skills, and MCP configuration
        run: ./scripts/doctor.sh

      - name: Test platform-integration offline closed-loop boundaries
        run: >
          uv run --directory components/platform-integration --frozen
          pytest tests/test_app.py tests/test_cli.py tests/test_config.py
          tests/commands/test_closed_loop.py
          tests/clients/test_cmms_client.py
          tests/clients/test_thingsboard_client.py
          tests/services/test_closed_loop_acceptance.py
          tests/services/test_closed_loop_delivery.py -v

      - name: Validate platform-integration container hygiene statically
        shell: bash
        run: |
          git -C components/platform-integration check-ignore --no-index \
            .env.test-sentinel .pytest_cache/test-sentinel
          grep -Fqx '.env*' components/platform-integration/.dockerignore
          grep -Fqx '.pytest_cache/' components/platform-integration/.dockerignore
          grep -Fqx 'USER 10001:10001' components/platform-integration/Dockerfile
          grep -Fqx \
            'CMD ["platform-integration", "serve", "--host", "0.0.0.0", "--port", "8080"]' \
            components/platform-integration/Dockerfile

      - name: Test root workspace governance
        run: >
          uv run --with pytest==9.0.2
          pytest tests/test_workspace_governance.py -v

      - name: Validate Phase 1 integration contracts
        run: >
          uv run --directory tests --frozen
          pytest contract/phase1 -v

      - name: Validate Phase 2 offline shadow contracts
        run: >
          uv run --directory tests --frozen
          pytest e2e/test_fixture_scripts.py
          e2e/test_shadow_deployment_contract.py
          e2e/test_shadow_seed.py
          e2e/test_shadow_prediction.py
          -m "not pilot_e2e" --strict-markers -v

      - name: Validate closed-loop contracts and offline deployment controls
        run: >
          uv run --directory tests --frozen
          pytest contract/closed_loop
          e2e/test_closed_loop_deployment_contract.py
          e2e/test_closed_loop_bootstrap.py
          e2e/test_closed_loop_runtime_security.py
          e2e/test_closed_loop_state_io.py
          e2e/test_pilot_cmms_status.py
          -m "not pilot_e2e" --strict-markers -v

      - name: Validate CMMS development deployment controls
        run: >
          uv run --directory tests --frozen
          pytest e2e/test_cmms_deployment_contract.py
          e2e/test_cmms_deployment_records.py
          e2e/test_cmms_nginx_contract.py
          e2e/test_cmms_secure_artifacts.py
          e2e/test_cmms_toolchains_and_source.py
          -m "not pilot_e2e" --strict-markers -v

      - name: Smoke-test the MCP STDIO entry point
        run: ./scripts/run-digital-mcp.sh </dev/null

      - name: Confirm checks did not mutate tracked state
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          git submodule foreach --recursive 'test -z "$(git status --porcelain)"'
