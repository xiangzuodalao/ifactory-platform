worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 8k;

        location = /api/auth/me {
            limit_except GET { deny all; }
            proxy_pass http://cmms-api:8080/auth/me;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
        }

        location ~ "^/api/assets/by-equipment-id/[0-9a-f-]{36}$" {
            limit_except GET { deny all; }
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://cmms-api:8080;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
        }

        location = /api/assets {
            limit_except POST { deny all; }
            proxy_pass http://cmms-api:8080/assets;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header Cookie "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_pass_request_headers off;
        }

        location = /api/work-orders/by-external-ref {
            limit_except GET { deny all; }
            proxy_pass http://cmms-api:8080/work-orders/by-external-ref;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
        }

        location = /api/work-orders/search {
            limit_except POST { deny all; }
            client_max_body_size 4k;
            proxy_pass http://cmms-api:8080/work-orders/search;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_pass_request_headers off;
        }

        location ~ "^/api/work-orders/[1-9][0-9]*/change-status$" {
            limit_except PATCH { deny all; }
            client_max_body_size 1k;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://cmms-api:8080;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_pass_request_headers off;
        }

        location = /api/work-orders {
            limit_except POST { deny all; }
            proxy_pass http://cmms-api:8080/work-orders;
            proxy_set_header Host cmms-api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header Cookie "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_pass_request_headers off;
        }

        location / { return 404; }
    }
}
