worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        location ~ "^/api/v1/maintenance-alerts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/work-order-plan$" {
            limit_except GET { deny all; }
            proxy_pass http://integration-api:8080;
            proxy_set_header Host integration-api;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Authorization $http_x_authorization;
            proxy_set_header Idempotency-Key "";
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
        }

        location ~ "^/api/v1/maintenance-alerts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/actions$" {
            limit_except POST { deny all; }
            client_max_body_size 4k;
            proxy_pass http://integration-api:8080;
            proxy_set_header Host integration-api;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
            proxy_set_header X-Authorization $http_x_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_pass_request_headers off;
        }

        location /api/ws {
            proxy_pass http://tb-relay:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://tb-relay:8080;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://tb-relay:4200;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
